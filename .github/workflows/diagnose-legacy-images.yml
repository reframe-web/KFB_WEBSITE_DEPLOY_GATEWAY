name: Diagnose archived KFB image retrieval (no images uploaded)
on:
  push:
    paths: [".github/workflows/diagnose-legacy-images.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check read-only service-account access to original WordPress server backup
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {createSign} from "node:crypto";
          const sa=JSON.parse(process.env.GDRIVE_SERVICE_ACCOUNT_JSON);
          const now=Math.floor(Date.now()/1000);
          const enc=s=>Buffer.from(JSON.stringify(s)).toString('base64url');
          const h=enc({alg:"RS256",typ:"JWT"});
          const b=enc({iss:sa.client_email,scope:"https://www.googleapis.com/auth/drive.readonly",
            aud:"https://oauth2.googleapis.com/token",iat:now,exp:now+900});
          const signer=createSign("RSA-SHA256");signer.update(h+"."+b);signer.end();
          const jwt=h+"."+b+"."+signer.sign(sa.private_key).toString("base64url");
          const oauth=await fetch("https://oauth2.googleapis.com/token",{method:"POST",
            headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion:jwt}),
            signal:AbortSignal.timeout(12000)});
          if(!oauth.ok)throw Error("OAuth HTTP "+oauth.status);
          const tok=(await oauth.json()).access_token;
          for(const id of ["1Fkptg-V5cB5BjZQLsba-tjMmpxt5h4Xh","1mMh5zN-MBiI-VUdPG73oBKT-hT1SjPE6"]){
            const r=await fetch("https://www.googleapis.com/drive/v3/files/"+id+"?fields=id%2Cname%2Csize%2CmimeType",
              {headers:{Authorization:"Bearer "+tok},signal:AbortSignal.timeout(12000)});
            const v=r.ok?await r.json():null;
            console.log("Drive backup metadata access",r.status, v?.name??"unavailable",v?.size??"");
          }
          JS
      - name: Test original public URLs without saving personal images
        shell: bash
        run: |
          set -uo pipefail
          for url in \
            "https://web-resource.tsuku2.jp/pic/blog/0000086504/a070a5cf7084d853f9dc2f6907f8f798.jpg" \
            "https://web-resource.tsuku2.jp/pic/blog/0000086504/6803eab8820c920abb776df680ffdc49.jpg" \
            "https://home.tsuku2.jp/storeBlogDetail.php?scd=0000086504%26no=25019" \
            "https://web.archive.org/cdx/search/cdx?url=web-resource.tsuku2.jp%2Fpic%2Fblog%2F0000086504%2Fa070a5cf7084d853f9dc2f6907f8f798.jpg%26output=json"; do
            printf 'PROBE hostname/path: %s\n' "$url"
            curl --location --silent --show-error --max-time 18 --head \
                 --output /dev/null --write-out 'HTTP %{http_code}; content_type %{content_type}; remote_ip %{remote_ip}; redirect %{redirect_url}\n' "$url" || :
          done
          echo 'ARCHIVE CDX exact image:'
          curl --location --silent --show-error --max-time 25 \
            --get 'https://web.archive.org/cdx/search/cdx' \
            --data-urlencode 'url=web-resource.tsuku2.jp/pic/blog/0000086504/a070a5cf7084d853f9dc2f6907f8f798.jpg' \
            --data-urlencode 'output=json' \
            --data-urlencode 'filter=statuscode:200' | head -c 800 || :
          echo
          echo 'ARCHIVE CDX prefix (first entries only):'
          curl --location --silent --show-error --max-time 30 \
            --get 'https://web.archive.org/cdx/search/cdx' \
            --data-urlencode 'url=web-resource.tsuku2.jp/pic/blog/0000086504/*' \
            --data-urlencode 'output=json' \
            --data-urlencode 'filter=statuscode:200' \
            --data-urlencode 'collapse=urlkey' | head -c 1000 || :
          echo
