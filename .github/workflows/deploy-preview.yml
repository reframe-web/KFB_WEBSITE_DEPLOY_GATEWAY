name: Deploy KFB site from Drive

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for this preview deployment"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".deploy/preview-request.json"

permissions:
  contents: read

concurrency:
  group: kfb-private-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRIVE_SOURCE_FOLDER_ID: "1nIQrLm5e2mXIAAyE6pF-SdxSuiOhqyV8"

    steps:
      - name: Check out deployment gateway
        uses: actions/checkout@v4

      - name: Resolve guarded deployment request
        id: request
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            reason="${{ inputs.reason }}"
            if [ -z "$reason" ]; then reason="manual-preview-deploy"; fi
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "request_id=workflow-dispatch-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          request=".deploy/preview-request.json"
          test -f "$request"

          schema="$(jq -r '.schema // 0' "$request")"
          deploy="$(jq -r '.deploy // false' "$request")"
          request_id="$(jq -r '.request_id // ""' "$request")"
          reason="$(jq -r '.reason // "drive-preview-request"' "$request")"

          if [ "$schema" != "1" ]; then
            echo "Unsupported preview request schema: $schema" >&2
            exit 1
          fi

          if [ "$deploy" != "true" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
            echo "reason=not-armed" >> "$GITHUB_OUTPUT"
            echo "Preview request is not armed; no deployment will run."
            exit 0
          fi

          if ! [[ "$request_id" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "Invalid preview request_id." >&2
            exit 1
          fi

          echo "armed=true" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.request.outputs.armed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Define temporary Drive snapshot
        if: steps.request.outputs.armed == 'true'
        shell: bash
        run: |
          echo "SNAPSHOT_DIR=$RUNNER_TEMP/kfb-drive-source" >> "$GITHUB_ENV"

      - name: Fetch stable read-only Drive snapshot
        if: steps.request.outputs.armed == 'true'
        id: snapshot
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: node gateway/fetch-drive-source.mjs

      - name: Generate bilingual legacy archive pages
        if: steps.request.outputs.armed == 'true'
        shell: bash
        run: node gateway/build-legacy-pages.mjs "$SNAPSHOT_DIR"

      - name: Validate KFB site source
        if: steps.request.outputs.armed == 'true'
        shell: bash
        run: node gateway/verify-source.mjs "$SNAPSHOT_DIR"

      - name: Stage ephemeral static assets
        if: steps.request.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime-site
          mkdir -p .runtime-site
          cp -a "$SNAPSHOT_DIR"/. .runtime-site/
          rm -f .runtime-site/README.txt

      - name: Deploy fail-closed private preview
        if: steps.request.outputs.armed == 'true'
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kfb-wrangler-output.txt"

          set +e
          npx --yes wrangler@4.145.0 deploy --config gateway/wrangler.preview.jsonc 2>&1 | tee "$output"
          wrangler_status=${PIPESTATUS[0]}
          set -e

          if [ "$wrangler_status" -ne 0 ]; then
            if grep -Fq "Uploaded kfb-preview" "$output" \
              && grep -Fq "/workers/subdomain" "$output" \
              && grep -Fq "Authentication error [code: 10000]" "$output"; then
              echo "Wrangler uploaded kfb-preview successfully; continuing after its account-subdomain lookup was denied by the intentionally per-Worker API token."
            else
              echo "Wrangler deployment failed before a verified Worker upload." >&2
              exit "$wrangler_status"
            fi
          fi

          origin="https://kfb-preview.hungrypriest1224.workers.dev"
          echo "preview_origin=$origin" >> "$GITHUB_OUTPUT"

          robots_code="$(curl -sS -o "$RUNNER_TEMP/robots.txt" -D "$RUNNER_TEMP/robots.headers" -w '%{http_code}' "$origin/robots.txt")"
          test "$robots_code" = "200"
          grep -Fq "Disallow: /" "$RUNNER_TEMP/robots.txt"
          grep -Fiq "x-robots-tag: noindex, nofollow, noarchive" "$RUNNER_TEMP/robots.headers"

          private_code="$(curl -sS -o "$RUNNER_TEMP/private-check.txt" -D "$RUNNER_TEMP/private.headers" -w '%{http_code}' "$origin/ja/")"
          if [ "$private_code" != "401" ] && [ "$private_code" != "503" ]; then
            echo "Private preview unexpectedly returned HTTP $private_code without credentials." >&2
            exit 1
          fi
          grep -Fiq "x-robots-tag: noindex, nofollow, noarchive" "$RUNNER_TEMP/private.headers"

          public_origin="https://kfbokinawa.org"
          public_code="$(curl -sS -L --max-redirs 2 -o "$RUNNER_TEMP/public-home.html" -D "$RUNNER_TEMP/public.headers" -w '%{http_code}' "$public_origin/ja/")"
          test "$public_code" = "200"
          ! grep -Fiq "x-robots-tag: noindex" "$RUNNER_TEMP/public.headers"
          ! grep -Fiq 'content="noindex' "$RUNNER_TEMP/public-home.html"
          ! grep -Fq "公開前プレビュー" "$RUNNER_TEMP/public-home.html"
          grep -Fq "info@kfbokinawa.org" "$RUNNER_TEMP/public-home.html"

          public_en_code="$(curl -sS -L --max-redirs 2 -o "$RUNNER_TEMP/public-en.html" -w '%{http_code}' "$public_origin/en/")"
          test "$public_en_code" = "200"
          ! grep -Fq "Private pre-release preview" "$RUNNER_TEMP/public-en.html"

          privacy_code="$(curl -sS -L --max-redirs 2 -o "$RUNNER_TEMP/privacy.html" -w '%{http_code}' "$public_origin/ja/privacy/")"
          test "$privacy_code" = "200"

          robots_code="$(curl -sS -o "$RUNNER_TEMP/public-robots.txt" -w '%{http_code}' "$public_origin/robots.txt")"
          test "$robots_code" = "200"
          grep -Fq "Allow: /" "$RUNNER_TEMP/public-robots.txt"
          grep -Fq "Sitemap: https://kfbokinawa.org/sitemap.xml" "$RUNNER_TEMP/public-robots.txt"

          sitemap_code="$(curl -sS -o "$RUNNER_TEMP/public-sitemap.xml" -w '%{http_code}' "$public_origin/sitemap.xml")"
          test "$sitemap_code" = "200"
          grep -Fq "https://kfbokinawa.org/ja/" "$RUNNER_TEMP/public-sitemap.xml"
          grep -Fq "https://kfbokinawa.org/en/" "$RUNNER_TEMP/public-sitemap.xml"
          ! grep -Fq "/activities/archive/" "$RUNNER_TEMP/public-sitemap.xml"

          legacy_code="$(curl -sS -o /dev/null -w '%{http_code}' "$public_origin/ja/activities/archive/legacy-tsukutsuku-8692/")"
          test "$legacy_code" = "404"
          legacy_data_code="$(curl -sS -o /dev/null -w '%{http_code}' "$public_origin/data/legacy-preview.json")"
          test "$legacy_data_code" = "404"

          support_code="$(curl -sS -L --max-redirs 2 -o "$RUNNER_TEMP/support.html" -w '%{http_code}' "$public_origin/ja/support/")"
          test "$support_code" = "200"
          ! grep -Fq "公開前にKFB側の最終確認" "$RUNNER_TEMP/support.html"
          ! grep -Fq "非公開プレビュー" "$RUNNER_TEMP/support.html"

          www_code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/www.headers" -w '%{http_code}' --max-time 20 "https://www.kfbokinawa.org/ja/" || true)"
          if [ "$www_code" = "301" ] || [ "$www_code" = "308" ]; then
            grep -Fiq "location: https://kfbokinawa.org/ja/" "$RUNNER_TEMP/www.headers"
            echo "www redirect verified."
          else
            echo "www.kfbokinawa.org is not yet routed to the Worker; apex public release is healthy. www remains a DNS/custom-domain follow-up." >&2
          fi

      - name: Write deployment summary
        if: steps.request.outputs.armed == 'true' && success()
        shell: bash
        run: |
          {
            echo "## KFB site deployment"
            echo
            echo "- Canonical source: Google Drive / KFB WEBSITE DEV / 40_SITE / SOURCE"
            echo "- Drive source fingerprint: ${{ steps.snapshot.outputs.source_fingerprint }}"
            echo "- Worker: kfb-preview"
            echo "- Public production domain: https://kfbokinawa.org/"
            echo "- Authentication policy: workers.dev preview remains private; canonical domain is public"
            echo "- Search policy: canonical domain indexable; preview host remains noindex"
            echo "- Request ID: ${{ steps.request.outputs.request_id }}"
            echo "- Reason: ${{ steps.request.outputs.reason }}"
            if [ -n "${{ steps.deploy.outputs.preview_origin }}" ]; then
              echo "- Preview origin: ${{ steps.deploy.outputs.preview_origin }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary KFB source snapshot
        if: always()
        shell: bash
        run: |
          if [ -n "${SNAPSHOT_DIR:-}" ] && [ -d "$SNAPSHOT_DIR" ]; then rm -rf "$SNAPSHOT_DIR"; fi
          rm -rf .runtime-site
